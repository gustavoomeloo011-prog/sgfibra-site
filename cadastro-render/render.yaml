services:
  - type: web
    name: sg-fibra-cadastro
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: SGP_URL
        value: https://sgfibra.sgp.tsmx.app
      - key: SGP_APP
        sync: false
      - key: SGP_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DAILY_LIMIT
        value: 2
      - key: CONTRACT_ENABLED
        value: false
      - key: PUBLIC_BASE_URL
        value: https://cadastro.sgfibra.com.br
      - key: MAX_DOCUMENT_SIZE
        value: 4194304
      - key: ATTACH_DOCUMENTS
        value: true
      - key: REQUIRE_DOCUMENT_ATTACH
        value: false
      - key: SGP_ATTACH_PATH
        value: /api/crm/cliente/{id}/anexos
      - key: SGP_ATTACH_FIELD
        value: files
      - key: PLANS_JSON
        value: '{"500-mega-internet":{"id":0,"name":"500 Mega - Internet fibra"},"700-mega-internet":{"id":0,"name":"700 Mega - Internet fibra"}}'
